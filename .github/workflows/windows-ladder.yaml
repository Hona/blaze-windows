name: Windows bounded verification
on:
  push:
    branches: [windows/int29-ladder]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(contains(github.event.head_commit.message, '[ladder only]') && '["release-engine"]' || '["units","release-engine"]') }}
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # A change only to the ladder driver does not change either executable. Bump the
      # cache schema below if this workflow changes compiler arguments or packaging.
      - id: source
        run: |
          $rev = git log -1 --format=%H -- . ':(exclude).github/scripts/windows-ladder.ps1' ':(exclude).github/workflows/windows-ladder.yaml'
          if ($LASTEXITCODE -or $rev -notmatch '^[0-9a-f]{40}$') { throw 'cannot identify the binary inputs' }
          "revision=$rev" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: cached
        with:
          path: bundle
          key: windows-x64-msvc-v1-${{ matrix.bundle }}-${{ steps.source.outputs.revision }}
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/toolchain
        with:
          llvm: build
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - if: matrix.bundle == 'units' && steps.cached.outputs.cache-hit != 'true'
        name: Package each unit executable from Cargo's artifact messages
        run: |
          New-Item -ItemType Directory bundle | Out-Null
          $crates = 'blaze-cargo','blaze-cas','blaze-core','blaze-link','blaze-mem','blaze-usercode','blaze-vfs'
          $packages = foreach ($c in $crates) { '-p'; $c }
          cargo test --locked --no-run --lib @packages --message-format=json-render-diagnostics > artifacts.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($item in (Get-Content artifacts.jsonl | ConvertFrom-Json)) {
            if ($item.reason -eq 'compiler-artifact' -and $item.profile.test -and $item.executable) {
              $name = $item.target.name.Replace('_','-')
              if ($name -in $crates) { Copy-Item -LiteralPath $item.executable "bundle/$name.exe" }
            }
          }
          foreach ($name in $crates) { Get-Item "bundle/$name.exe" }
      - if: matrix.bundle == 'release-engine' && steps.cached.outputs.cache-hit != 'true'
        name: Build the release engine used by both ends of the ladder
        run: |
          cargo build --locked --release -p blaze-engine --bin blaze
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item target/release/blaze.exe bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}-${{ github.sha }}
          path: bundle/*.exe
          retention-days: 3
          if-no-files-found: error
  units:
    needs: compile
    if: "!contains(github.event.head_commit.message, '[ladder only]')"
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        crate: [blaze-cargo, blaze-cas, blaze-core, blaze-link, blaze-mem, blaze-usercode, blaze-vfs]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - uses: actions/download-artifact@v4
        with:
          name: units-${{ github.sha }}
          path: target/debug/deps
      - name: Run the suite with runner headroom
        run: ./.github/scripts/windows-suite.ps1 '${{ matrix.crate }}'
  ladder:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        fixture: [hello, withdeps]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - uses: actions/download-artifact@v4
        with:
          name: release-engine-${{ github.sha }}
          path: target/release
      - name: Provision the checkout change journal on the disposable scratch volume
        run: |
          $volume = [IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd('\')
          fsutil usn queryjournal $volume
          if ($LASTEXITCODE) {
            fsutil usn createjournal m=33554432 a=4194304 $volume
            if ($LASTEXITCODE) { throw "could not provision USN journal on $volume" }
          }
      - run: ./.github/scripts/windows-ladder.ps1 -Blaze "$PWD/target/release/blaze.exe" -Out "$env:RUNNER_TEMP/ladder" -Fixture '${{ matrix.fixture }}'
        env:
          RUST_BACKTRACE: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ladder-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/ladder/*.log
            ${{ runner.temp }}/ladder/*.csv
            ${{ runner.temp }}/ladder/home/v2/serve.log
