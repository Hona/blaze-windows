# Standalone Windows release ladder (manual dispatch only, once on the default branch).
# Batch verification runs the ladders inside `.github/workflows/windows-host.yaml` on `windows/batch`
# so pushes to `windows/int` or any other branch start nothing here.
name: Windows release ladder

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Engine revision (defaults to the workflow checkout)
        required: false

permissions:
  contents: read

concurrency:
  group: windows-ladder-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  RUST_BACKTRACE: '0'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the engine, independently of the driver
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if ($env:REVISION) { git checkout --detach $env:REVISION; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          git rev-parse HEAD
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - id: cache
        uses: ./.github/actions/windows-cargo-cache
        with:
          profile: release
          slot: engine
      - run: cargo build --locked --release -p blaze-engine --bin blaze
      - uses: actions/upload-artifact@v7
        with:
          name: release-engine
          path: target/release/blaze.exe
          retention-days: 3
          if-no-files-found: error
      - uses: ./.github/actions/windows-cargo-cache-save
        with:
          profile: release
          cache-hit: ${{ steps.cache.outputs.deps-cache-hit }}
          cache-key: ${{ steps.cache.outputs.deps-cache-key }}

  ladder:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fixture: [hello, withdeps, rune-cstr, one-luau, r28-ops]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - uses: actions/download-artifact@v8
        with:
          name: release-engine
          path: target/release
      - name: Provision the scratch volume change journal
        run: |
          $volume = [IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd('\')
          fsutil usn queryjournal $volume
          if ($LASTEXITCODE) { fsutil usn createjournal m=33554432 a=4194304 $volume }
      - name: Run the ladder with runner memory telemetry
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          . ./.github/scripts/windows-memory.ps1
          $outDir = Join-Path $env:RUNNER_TEMP 'ladder'
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $p = Start-Process pwsh -NoNewWindow -PassThru -ArgumentList @(
            '-NoProfile', '-File', '.github/scripts/windows-ladder.ps1',
            '-Blaze', "$PWD/target/release/blaze.exe",
            '-Out', $outDir,
            '-Fixture', $env:FIXTURE,
            '-ContinueOnFailure'
          )
          $metrics = Wait-WithHeadroom -Process $p -MetricsPath (Join-Path $outDir 'metrics.json') -NoThrow
          $code = if ($p.HasExited) { $p.ExitCode } else { 137 }
          if ($metrics.guard_tripped -and $code -eq 0) { $code = 137 }
          $p.Dispose()
          exit $code
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ladder-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/ladder/*.log
            ${{ runner.temp }}/ladder/*.csv
            ${{ runner.temp }}/ladder/*.json
          retention-days: 7
          if-no-files-found: warn
