name: Windows bugcheck repro
# The minimal reproduction of the bugcheck 0x1A/0x3453 on process exit that blaze's test binary
# hit on a workstation (.github/bsod-repro/README.md), run on a GitHub runner, which is a VM.
# Never run it on a developer's machine.
on:
  workflow_dispatch:
    inputs:
      children:
        description: rounds of every mode, each in its own child process
        default: '50'
      reservations:
        description: 4 TiB reservations a child
        default: '16'
      windows:
        description: 1 GiB windows (or 2 MiB chunks) touched a reservation
        default: '1024'
  push:
    branches: [windows/bsod-repro]

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/bsod-repro
      - name: Build
        working-directory: .github/bsod-repro
        run: cargo build --release
      - name: Run every mode in child processes
        working-directory: .github/bsod-repro
        run: |
          $children = '${{ inputs.children }}'; if (-not $children) { $children = '50' }
          $reservations = '${{ inputs.reservations }}'; if (-not $reservations) { $reservations = '16' }
          $windows = '${{ inputs.windows }}'; if (-not $windows) { $windows = '1024' }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, TotalVisibleMemorySize | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          ./target/release/bsod-repro.exe all --children $children --reservations $reservations --windows $windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  verdict:
    needs: repro
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Say whether the runner survived
        run: |
          echo "repro job: ${{ needs.repro.result }}"
          echo "A runner that bugchecked shows as failure with 'The hosted runner lost communication with the server'."
