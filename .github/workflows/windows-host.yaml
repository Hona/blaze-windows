name: Windows host
on:
  pull_request:
  workflow_dispatch:
    inputs:
      revisions:
        description: 'Optional JSON list of fork commit SHAs to compare'
        type: string
        default: ''
  push:
    branches: [windows/host, windows/int]

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # The engine and unit graph build different sets of crate features. Give each a
    # fresh disk instead of keeping two copies of LLVM-linked targets on a single VM.
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(inputs.revisions || (github.event_name == 'push' && endsWith(github.event.head_commit.message, '[compare host]') && '["df70baaf8d1b9754173fb0ab51e277f5c0d8f38d","c553ddba520c9d84244732ee3ddda34482cb06f4"]') || format('["{0}"]', github.sha)) }}
        suite: [engine, units]
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '0'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      # The pinned /MT LLVM uses STL entry points absent from VS 2022's 14.44 libcpmt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - name: Check the selected CRT
        run: |
          if ($env:VCToolsVersion -notmatch '^14\.5\d\.') {
            throw "LLVM needs MSVC 14.5x; selected '$env:VCToolsVersion'"
          }
          cl 2>&1 | Select-Object -First 1
      - name: Bootstrap the engine
        if: matrix.suite == 'engine'
        run: cargo build --locked -p blaze-engine --bin blaze
      - name: Check the bootstrap binary
        if: matrix.suite == 'engine'
        run: |
          ./target/debug/blaze.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $headers = dumpbin /nologo /headers target/debug/blaze.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($headers -match '^\s*800000 size of stack reserve\s*$')) {
            throw 'blaze.exe does not reserve an 8 MiB main-thread stack'
          }
      - name: Compile unit executables without starting them
        if: matrix.suite == 'units'
        run: |
          Get-PSDrive C,D | Format-Table Name,Used,Free
          $p = Start-Process cargo -ArgumentList 'test --locked --no-run --lib -p blaze-core -p blaze-cargo -p blaze-usercode -p blaze-mem -p blaze-cas -p blaze-vfs -p blaze-link' -NoNewWindow -PassThru
          while (-not $p.WaitForExit(30000)) {
            $os = Get-CimInstance Win32_OperatingSystem
            Write-Host "free MiB: RAM $([int]($os.FreePhysicalMemory/1024)), commit $([int]($os.FreeVirtualMemory/1024)), disk C $([int]((Get-PSDrive C).Free/1MB)), disk D $([int]((Get-PSDrive D).Free/1MB))"
          }
          exit $p.ExitCode
      - name: Run host, store and linker units
        if: matrix.suite == 'units'
        run: cargo test --locked --no-fail-fast --lib -p blaze-core -p blaze-cargo -p blaze-usercode -p blaze-mem -p blaze-cas -p blaze-vfs -p blaze-link
      - name: Portable tool call sites and planted regressions
        if: '!cancelled() && matrix.suite == ''engine'''
        run: cargo test --locked -p astlog-core --test rules
