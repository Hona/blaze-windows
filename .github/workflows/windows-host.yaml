name: Windows host
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [windows/host, windows/int]

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # The engine and unit graph build different sets of crate features. Give each a
    # fresh disk instead of keeping two copies of LLVM-linked targets on a single VM.
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, units]
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '0'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      # The pinned /MT LLVM uses STL entry points absent from VS 2022's 14.44 libcpmt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - name: Check the selected CRT
        run: |
          if ($env:VCToolsVersion -notmatch '^14\.5\d\.') {
            throw "LLVM needs MSVC 14.5x; selected '$env:VCToolsVersion'"
          }
          cl 2>&1 | Select-Object -First 1
      - name: Bootstrap the engine
        if: matrix.suite == 'engine'
        run: cargo build --locked -p blaze-engine --bin blaze
      - name: Check the bootstrap binary
        if: matrix.suite == 'engine'
        run: |
          ./target/debug/blaze.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $headers = dumpbin /nologo /headers target/debug/blaze.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($headers -match '^\s*800000 size of stack reserve\s*$')) {
           throw 'blaze.exe does not reserve an 8 MiB main-thread stack'
           }
      - if: matrix.suite == 'engine'
        uses: actions/upload-artifact@v4
        with:
          name: windows-engine-${{ github.sha }}
          path: target/debug/blaze.exe
          retention-days: 3
          if-no-files-found: error
      - name: Compile unit executables without starting them
        if: matrix.suite == 'units'
        run: |
          Get-PSDrive C,D | Format-Table Name,Used,Free
          $p = Start-Process cargo -ArgumentList 'test --locked --no-run --message-format=json-render-diagnostics --lib -p blaze-core -p blaze-cargo -p blaze-usercode -p blaze-mem -p blaze-cas -p blaze-vfs -p blaze-link' -NoNewWindow -PassThru -RedirectStandardOutput artifacts.jsonl
          while (-not $p.WaitForExit(30000)) {
            $os = Get-CimInstance Win32_OperatingSystem
            Write-Host "free MiB: RAM $([int]($os.FreePhysicalMemory/1024)), commit $([int]($os.FreeVirtualMemory/1024)), disk C $([int]((Get-PSDrive C).Free/1MB)), disk D $([int]((Get-PSDrive D).Free/1MB))"
          }
          if ($p.ExitCode) { exit $p.ExitCode }
          New-Item -ItemType Directory bundle | Out-Null
          $crates = 'blaze-cargo','blaze-cas','blaze-core','blaze-link','blaze-mem','blaze-usercode','blaze-vfs'
          foreach ($item in (Get-Content artifacts.jsonl | ConvertFrom-Json)) {
            if ($item.reason -eq 'compiler-artifact' -and $item.profile.test -and $item.executable) {
              $name = $item.target.name.Replace('_','-')
              if ($name -in $crates) { Copy-Item -LiteralPath $item.executable "bundle/$name.exe" }
            }
          }
          foreach ($name in $crates) { Get-Item "bundle/$name.exe" }
      - if: matrix.suite == 'units'
        uses: actions/upload-artifact@v4
        with:
          name: windows-units-${{ github.sha }}
          path: bundle/*.exe
          retention-days: 3
          if-no-files-found: error
      - name: Portable tool call sites and planted regressions
        if: '!cancelled() && matrix.suite == ''engine'''
        run: cargo test --locked -p astlog-core --test rules

  units:
    needs: bootstrap
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        crate: [blaze-cargo, blaze-cas, blaze-core, blaze-link, blaze-mem, blaze-usercode, blaze-vfs]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - uses: actions/download-artifact@v4
        with:
          name: windows-units-${{ github.sha }}
          path: target/debug/deps
      - name: Run the suite with runner headroom
        run: ./.github/scripts/windows-suite.ps1 '${{ matrix.crate }}'
