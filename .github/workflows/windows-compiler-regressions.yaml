# Standalone Windows compiler regressions (manual dispatch only, once on the default branch).
# Batch verification runs these tests from prebuilt binaries inside
# `.github/workflows/windows-host.yaml` on `windows/batch` so pushes to `windows/int` or any other
# branch start nothing here.
name: Windows compiler regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-regressions-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  RUST_BACKTRACE: '0'

jobs:
  regressions:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.5'
      - id: cache
        uses: ./.github/actions/windows-cargo-cache
        with:
          profile: debug
          slot: regressions
      - name: Verify row directory commit, derived impl publication and const backing storage
        id: regs
        continue-on-error: true
        run: ./.github/scripts/windows-regressions.ps1 -OutDir 'regressions-out' -UseCargo
      - uses: ./.github/actions/windows-cargo-cache-save
        with:
          profile: debug
          cache-hit: ${{ steps.cache.outputs.deps-cache-hit }}
          cache-key: ${{ steps.cache.outputs.deps-cache-key }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-regressions-results
          path: regressions-out/**
          retention-days: 7
          if-no-files-found: warn
      - if: steps.regs.outcome == 'failure'
        run: exit 1
