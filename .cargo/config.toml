[alias]
tq = "test -- -q"
qt = "tq"
lint = "clippy --all-targets -- --cap-lints warn"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
# The pinned LLVM is built against the static C runtime (/MT, .github/scripts/llvm.py), and its
# objects ask for libcpmt and refuse a /MD object beside them: blaze links the CRT statically too.
rustflags = ["-C", "target-feature=+crt-static"]

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc-8"

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

# blaze's crates built for a browser: there are no threads to drop syntax trees on
# (crates/syntax, `no_async_drops`).
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "no_async_drops"]

# The wasm64 seed (docs/future/bootstrap.md): getrandom has no backend for wasm64 WASI, so it
# takes its `custom` one, which the target's runtime defines over the host's `random_get`
# (library/wasi_rt/src/rt/random.rs).
[target.wasm64-blaze-wasip1]
rustflags = ["--cfg", 'getrandom_backend="custom"']
